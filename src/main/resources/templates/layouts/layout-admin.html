<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title>Quan ly Category</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 15px; }
        table, th, td { border: 1px solid #333; }
        th, td { padding: 8px 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        .text-center { text-align: center; }
        .pagination { display: flex; list-style: none; padding: 0; gap: 4px; margin-top: 15px; }
        .pagination li { display: inline-block; }
        .pagination li a, .pagination li span { padding: 5px 10px; border: 1px solid #999; text-decoration: none; color: black; }
        .pagination li.active a, .pagination li.active span { background-color: #007bff; color: white; border-color: #007bff; }
        .pagination li.disabled span { color: #ccc; border-color: #eee; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { padding: 6px 10px; width: 350px; }
        .form-error { color: red; font-size: 13px; }
        .alert { padding: 10px; margin-bottom: 15px; border-radius: 4px; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-warning { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>
    <!-- Header -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Content -->
    <main layout:fragment="content">
        <p>Noi dung trang...</p>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
