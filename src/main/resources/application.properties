spring.application.name=SpringBoot
server.port=8009


#viewresolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
#spring.mvc.static-path-pattern=/static/**


#connect database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WebProgrammingSpringBoot;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver



#JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true



#Hibernate ddl auto (create, create-drop, update, none)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

